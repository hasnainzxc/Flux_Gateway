version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: flux-postgres
    environment:
      POSTGRES_USER: flux
      POSTGRES_PASSWORD: flux_dev
      POSTGRES_DB: flux_gateway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flux -d flux_gateway"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flux-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass flux_redis_dev
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flux-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://flux:flux_dev@postgres:5432/flux_gateway
      - REDIS_URL=redis://:flux_redis_dev@redis:6379/0
      - SECRET_KEY=changeme-in-production
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
