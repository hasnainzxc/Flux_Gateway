[project]
name = "flux-gateway"
version = "0.1.0"
description = "Data-to-Agent Gateway — secure B2B SaaS platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "structlog>=24.0.0",
    "cryptography>=42.0.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.1.0",
    "pgvector>=0.3.0",
    "aiofiles>=24.0.0",
    "pymupdf>=1.24.0",
    "tiktoken>=0.7.0",
    "docker>=7.0.0",
    "arq>=0.26.0",
    "stripe>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0,<7.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
ml = [
    "sentence-transformers>=3.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/services/schema_reflection.py" = ["E501"]
"src/db/models/chunk.py" = ["E501"]
"src/db/models/citation.py" = ["E501"]
"src/db/models/document.py" = ["E501"]
"src/services/rag_ingestion.py" = ["E501"]
"src/api/v1/rag.py" = ["E501"]
"src/agents/nodes/classify_intent.py" = ["E501"]
"src/agents/nodes/coder.py" = ["E501"]
"src/agents/nodes/researcher.py" = ["E501"]
"src/agents/nodes/reviewer.py" = ["E501"]
"src/agents/nodes/self_heal.py" = ["E501"]
"src/agents/nodes/mcp_executor.py" = ["E501"]
"src/agents/nodes/format_response.py" = ["E501"]
"src/agents/graph.py" = ["E501"]
"src/api/v1/agent.py" = ["E501"]
"src/api/v1/sandbox.py" = ["E501"]
"src/services/sandbox.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
